name: Update Daily Calendar Preview

on:
  schedule:
    - cron: '0 16 * * *' # 台灣時間每天晚上 12 點 (午夜 00:00) 執行，對應 UTC 16:00
  workflow_dispatch: # 支援在 GitHub 官網手動點擊按鈕測試

jobs:
  update-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install playwright

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium

      - name: Run screenshot script
        env:
          WORKER_DOMAIN: "https://checkin.twitchevent.workers.dev"
          OBS_KEY: ${{ secrets.OBS_KEY }}
        run: node scripts/take-screenshot.js

      - name: 自動更新圖片時間參數
        run: |
          # 取得當下的 UNIX 時間戳記
          TIMESTAMP=$(date +%s)
          
          # 自動把檔案裏面的 checkinpreview.png 結尾加上或更新為 ?v=時間戳記
          # 這樣不管原本有沒有 ?v=，都能自動匹配並換成最新時間
          sed -i "s|checkinpreview.png\(\?v=[0-9]*\)\?|checkinpreview.png?v=$TIMESTAMP|g" demo.html || true
          sed -i "s|checkinpreview.png\(\?v=[0-9]*\)\?|checkinpreview.png?v=$TIMESTAMP|g" preview.html || true
          sed -i "s|checkinpreview.png\(\?v=[0-9]*\)\?|checkinpreview.png?v=$TIMESTAMP|g" worker.js || true

      - name: Commit and push updated image and code
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # 同時將截圖和修改過時間參數的網頁原始碼加入 Git
          git add checkinpreview.png demo.html preview.html worker.js
          git commit -m "chore: auto-update daily calendar preview image and cache version [skip ci]" || echo "No changes to commit"
          git push
